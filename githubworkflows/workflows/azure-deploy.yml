name: Deploy Portfolio.API to Azure

on:
  push:
    branches:
      - master

#Critical : OIDC requires persmission to request token credentials from Azure

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: 'portfolioapi'
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'Portfolio.Api/Portfolio.Api.csproj'

jobs:
   build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Az CLI Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Restore and Build Specific Project
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release

    - name: Publish Specific Project
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish

    # Deploys directly to the web app using your authenticated Azure CLI session
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish