<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Theme</title>
    <style>
        body { font-family: Arial; background: #111; color: #fff; text-align: center; padding-top: 100px; }
        .theme { margin: 20px; padding: 20px; background: #222; display: inline-block; cursor: pointer; border-radius: 10px; }
        .theme:hover { background: #333; }
    </style>
</head>
<body>
    <h1>Choose Your Experience</h1>

    <div class="theme" onclick="selectTheme('classic')">Classic Theme</div>
    <div class="theme" onclick="selectTheme('developer')">Developer Theme</div>
    <div class="theme" onclick="selectTheme('space')">Space Theme</div>

    <script>
        function selectTheme(theme) {
            fetch(`/api/theme/select?theme=${theme}`, { method: 'POST' })
                .then(() => window.location.href = `/${theme}`);
        }
    </script>
</body>
</html>
